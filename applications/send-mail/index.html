<!DOCTYPE html>
<html lang="en">
<head>
<meta name="description" content="A contact-form UI demo built by Bao Tran.">
<title>Send Mail Demo | Bao Tran</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="utf-8">
    <style>
        @import url(https://fonts.googleapis.com/css?family=Montserrat:400,700);

	body { background:rgb(30,30,40); }
	form { max-width:420px; margin:50px auto; }

	.feedback-input {
	  color:white;
	  font-family: Helvetica, Arial, sans-serif;
	  font-weight:500;
	  font-size: 18px;
	  border-radius: 5px;
	  line-height: 22px;
	  background-color: transparent;
	  border:2px solid #ff6633;
	  transition: all 0.3s;
	  padding: 13px;
	  margin-bottom: 15px;
	  width:100%;
	  box-sizing: border-box;
	  outline:0;
	}

	.feedback-input:focus { border:2px solid #CC4949; }

	textarea {
	  height: 150px;
	  line-height: 150%;
	  resize:vertical;
	}

	[type="submit"] {
	  font-family: 'Montserrat', Arial, Helvetica, sans-serif;
	  width: 100%;
	  background:#ff6633;
	  border-radius:5px;
	  border:0;
	  cursor:pointer;
	  color:white;
	  font-size:24px;
	  padding-top:10px;
	  padding-bottom:10px;
	  transition: all 0.3s;
	  margin-top:-4px;
	  font-weight:700;
	}
	[type="submit"]:hover { background:#CC4949; }
    </style>

	
  <link rel="canonical" href="https://baoservis.com/applications/send-mail/">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4FGL76TVB5"></script>

    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-4FGL76TVB5');
  </script>
</head>
<body style="margin:0;padding:0;">

	
	<form name="contactform" method="post" action="mail.php">
		<input name="name" type="text" class="feedback-input" placeholder="Name*" required/>   
		<input name="email" type="email" class="feedback-input" placeholder="Your Email *" required/>
		<input name="email-to" type="email" class="feedback-input" placeholder="Recipient Email *" required/>
		<input name="subject" type="text" class="feedback-input" placeholder="Subject (Optional)"/>
		<textarea name="comments" class="feedback-input" placeholder="Leave a Message *" required></textarea>
		<input type="submit" value="SUBMIT"/>
	</form>

</body>
</html>
