<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | Bao Tran</title>
  <meta name="description" content="Bao Tran's blog archive.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0d0d0f; --text: #e8e4dc; --muted: #9d9aa5; --accent: #e8a020; --font-display: 'Syne', sans-serif; --font-mono: 'IBM Plex Mono', monospace; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-display); line-height: 1.6; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    a { color: var(--accent); text-decoration: none; }
    .box { max-width: 560px; }
    .kicker { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
    h1 { font-size: clamp(2rem, 7vw, 3.5rem); line-height: 1.05; margin: 1rem 0; }
    p { color: var(--muted); margin-bottom: 1rem; }
    .btn { display: inline-block; margin-top: 0.75rem; padding: 0.8rem 1.1rem; border: 1px solid var(--accent); border-radius: 6px; font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="box">
    <p class="kicker">Archive</p>
    <h1>Blog<span style="color: var(--accent);">.</span></h1>
    <p>The old WordPress blog is no longer hosted on GitHub Pages. The static archive has been retired while the posts are migrated.</p>
    <p>In the meantime, the portfolio, project pages, and demos are still available.</p>
    <a class="btn" href="/">← Back to baoservis.com</a>
  </div>
</body>
</html>
