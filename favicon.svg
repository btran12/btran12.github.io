<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background with cut top-right corner -->
  <polygon points="0,0 22,0 32,10 32,32 0,32" fill="#0d0d0f"/>
  <!-- Cut-corner accent line -->
  <polyline points="22,0 22,10 32,10" fill="none" stroke="#e8a020" stroke-width="1.5"/>

  <!-- BT monogram -->
  <!-- B -->
  <text
    x="4" y="22"
    font-family="'IBM Plex Mono', 'Courier New', monospace"
    font-size="14"
    font-weight="500"
    fill="#e8e4dc"
    letter-spacing="-1">BT</text>

  <!-- Amber underline accent -->
  <rect x="4" y="25" width="24" height="1.5" fill="#e8a020" rx="1"/>
</svg>
