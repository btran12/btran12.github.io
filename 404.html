<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found | Bao Tran</title>
  <meta name="description" content="The page you requested could not be found.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0d0d0f; --text: #e8e4dc; --muted: #9d9aa5; --accent: #e8a020; --border: rgba(255,255,255,0.08); --font-display: 'Syne', sans-serif; --font-mono: 'IBM Plex Mono', monospace; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-display); line-height: 1.6; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    a { color: inherit; text-decoration: none; }
    .box { max-width: 620px; width: 100%; }
    .code { font-family: var(--font-mono); font-size: clamp(4rem, 18vw, 9rem); line-height: 0.9; color: var(--accent); letter-spacing: -0.06em; }
    h1 { font-size: clamp(1.6rem, 5vw, 2.5rem); line-height: 1.1; margin: 1rem 0 0.75rem; }
    p { color: var(--muted); max-width: 50ch; margin-bottom: 1.5rem; }
    .links { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .btn { display: inline-block; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 6px; font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; }
    .btn--primary { background: var(--accent); border-color: var(--accent); color: #0d0d0f; font-weight: 600; }
    .btn:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>This page took a wrong turn.</h1>
    <p>The link may be old, or the page may have moved. Try one of these instead:</p>
    <div class="links">
      <a class="btn btn--primary" href="/">Home</a>
      <a class="btn" href="/projects/">Projects</a>
      <a class="btn" href="/demos/">Demos</a>
      <a class="btn" href="/index/">Demo index</a>
      <a class="btn" href="/resume/">Resume</a>
    </div>
  </div>
</body>
</html>
