<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photography Gallery | Bao Tran</title>
  <meta name="description" content="A macro photography gallery by Bao Tran.">
  <link rel="canonical" href="https://baoservis.com/gallery.html">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://baoservis.com/gallery.html">
  <meta property="og:title" content="Photography Gallery | Bao Tran">
  <meta property="og:description" content="A macro photography gallery by Bao Tran.">
  <meta property="og:image" content="https://baoservis.com/images/macro/red.JPG">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4FGL76TVB5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-4FGL76TVB5');
  </script>
  <style>
    :root { --bg: #0d0d0f; --text: #e8e4dc; --muted: #9d9aa5; --accent: #e8a020; --font-display: 'Syne', sans-serif; --font-mono: 'IBM Plex Mono', monospace; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-display); line-height: 1.6; }
    a { color: inherit; text-decoration: none; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
    header { padding: 3rem 0 2rem; }
    .back { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
    .back:hover { color: var(--accent); }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.05; margin: 1.25rem 0 0.5rem; }
    h1 span { color: var(--accent); }
    p.lead { color: var(--muted); max-width: 60ch; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0.75rem; padding-bottom: 3rem; }
    figure { background: #131316; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden; }
    figure img { width: 100%; height: 260px; object-fit: cover; display: block; }
    figcaption { padding: 0.7rem 0.9rem; font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    footer { border-top: 1px solid rgba(255,255,255,0.08); padding: 1.5rem 0 3rem; color: var(--muted); font-family: var(--font-mono); font-size: 0.72rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a class="back" href="/">← Back to baoservis.com</a>
      <h1>Macro<span>.</span></h1>
      <p class="lead">A small collection of macro photographs.</p>
    </header>

    <main class="grid">
      <figure>
        <img src="/images/macro/blue.JPG" alt="Macro photograph with blue tones" loading="lazy">
        <figcaption>Blue</figcaption>
      </figure>
      <figure>
        <img src="/images/macro/pepper.JPG" alt="Macro photograph of a pepper" loading="lazy">
        <figcaption>Pepper</figcaption>
      </figure>
      <figure>
        <img src="/images/macro/pepper_flower.JPG" alt="Macro photograph of a pepper flower" loading="lazy">
        <figcaption>Pepper flower</figcaption>
      </figure>
      <figure>
        <img src="/images/macro/red.JPG" alt="Macro photograph with red tones" loading="lazy">
        <figcaption>Red</figcaption>
      </figure>
      <figure>
        <img src="/images/macro/red_string.JPG" alt="Macro photograph of a red string" loading="lazy">
        <figcaption>Red string</figcaption>
      </figure>
    </main>

    <footer>
      <p>© 2026 Bao Tran · <a href="/">baoservis.com</a></p>
    </footer>
  </div>
</body>
</html>
